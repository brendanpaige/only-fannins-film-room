name: Film Room

on:
  schedule:
    # Mondays 13:00 UTC, ahead of Monday Night Football: 9 AM Eastern
    # during daylight time, 8 AM in winter.
    - cron: "0 13 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull the season from Sleeper and ESPN
        run: python3 league_insights.py

      # Keeps a weekly snapshot in history, and the commit counts as repo
      # activity: GitHub pauses schedules in public repos after 60 quiet days.
      # Pushes made with the workflow token don't trigger another run.
      - name: Commit this run's snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add league/league_data.js
          git diff --cached --quiet || git commit -m "Refresh league data"
          git push

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp league/film_room.html _site/index.html
          cp league/league_data.js _site/league_data.js
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
